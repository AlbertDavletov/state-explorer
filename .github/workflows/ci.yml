name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Source and package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Unit and documentation tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Browser tests and demo build
        run: npm run test:browser
      - name: Production demo at the Pages subpath
        run: npm run test:demo
      - name: Isolated package consumers (React 18 and 19)
        run: npm run check:packages
